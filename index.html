<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Card Stack</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="card3.css" />
    <link rel="stylesheet" href="card4.css" />
    <link rel="stylesheet" href="card6.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
  </head>
  <body>
    <!-- Three.js CSS3DRenderer 삽입 영역 -->

    <!-- 카드 소스 (초기화 시 Three.js 씬으로 이동됨) -->
    <div id="card-source" style="display: none">
      <!-- Card 4: Choo-Choo World 트랙 빌더 -->
      <section class="card" id="card-4">
        <div id="train-container"></div>
        <div class="c4-preview-label">🚂 Choo-Choo World</div>
        <div class="c4-title c4-controls">
          <div class="c4-title-text">
            <span class="c4-title-emoji">🚂</span>
            Choo-Choo World
          </div>
        </div>
        <div class="c4-compass c4-controls">
          <button class="c4-compass-btn" id="c4-rotate-btn" title="카메라 회전">
            🧭
          </button>
        </div>

        <!-- 트랙 빌더 독 (좌측) -->
        <div class="c4-track-dock c4-controls">
          <div class="c4-track-dock-title">Track Builder</div>
          <div class="c4-track-btn-row">
            <!-- 직선 트랙 -->
            <button
              class="c4-track-btn"
              id="c4-add-straight"
              title="직선 트랙 추가"
            >
              <svg class="c4-track-icon" viewBox="0 0 32 32">
                <line x1="4" y1="16" x2="28" y2="16" />
                <line x1="8" y1="12" x2="8" y2="20" />
                <line x1="16" y1="12" x2="16" y2="20" />
                <line x1="24" y1="12" x2="24" y2="20" />
              </svg>
            </button>
            <!-- 좌측 커브 -->
            <button
              class="c4-track-btn"
              id="c4-add-left"
              title="좌측 커브 추가"
            >
              <svg class="c4-track-icon" viewBox="0 0 32 32">
                <path d="M4 28 Q4 4 28 4" />
              </svg>
            </button>
            <!-- 우측 커브 -->
            <button
              class="c4-track-btn"
              id="c4-add-right"
              title="우측 커브 추가"
            >
              <svg class="c4-track-icon" viewBox="0 0 32 32">
                <path d="M28 28 Q28 4 4 4" />
              </svg>
            </button>
          </div>
          <div class="c4-track-btn-row">
            <!-- 동굴 트랙 추가 -->
            <button
              class="c4-track-btn"
              id="c4-add-tunnel"
              title="동굴 트랙 추가"
            >
              ⛰️
            </button>
            <!-- 호수 트랙 추가 -->
            <button
              class="c4-track-btn"
              id="c4-add-pond"
              title="호수 트랙 추가"
            >
              🏞️
            </button>
            <!-- 트랙 삭제 -->
            <button
              class="c4-track-btn remove"
              id="c4-remove-track"
              title="마지막 트랙 삭제"
            >
              🗑️
            </button>
            <!-- 트랙 삭제 -->
            <button
              class="c4-track-btn allremove"
              id="c4-allremove-track"
              title="전체 트랙 삭제"
            >
              ☠️
            </button>
          </div>
          <div class="c4-track-counter">
            <span>🛤️</span>
            <span id="c4-track-count">2</span>
          </div>
        </div>

        <!-- 메인 컨트롤 독 (하단 중앙) -->
        <div class="c4-dock c4-controls">
          <button class="c4-dock-btn" id="c4-play-btn" title="재생/정지">
            ▶️
          </button>
          <button class="c4-dock-btn" id="c4-speed-btn" title="속도 조절">
            🐢
          </button>
          <button class="c4-dock-btn" id="c4-daynight-btn" title="낮/밤 전환">
            ☀️
          </button>
          <span class="c4-dock-divider"></span>
          <button class="c4-dock-btn" id="c4-remove-wagon" title="칸 빼기">
            ➖
          </button>
          <span class="c4-wagon-counter"
            ><span id="c4-wagon-count">0</span>🚃</span
          >
          <button class="c4-dock-btn" id="c4-add-wagon" title="칸 추가">
            ➕
          </button>
          <span class="c4-dock-divider"></span>
          <button
            class="c4-dock-btn"
            id="c4-reset-train"
            title="기차 위치 초기화"
          >
            🔄
          </button>
        </div>
        <div class="c4-hint c4-controls">
          <span class="c4-hint-text">Drag to rotate</span>
          <span class="c4-hint-text">Scroll to zoom</span>
        </div>
        <button class="close-btn">뒤로가기</button>
      </section>

      <!-- Card 6: Three.js 기하학적 파티클 모핑 -->
      <section class="card" id="card-6">
        <div id="three-container-6"></div>
        <div id="phase-indicator-6">SPHERE</div>
        <div class="c6-scroll-hint"><span>↕ Scroll to morph</span></div>
        <div class="c6-click-hint">Click special nodes to interact</div>
        <button class="close-btn">뒤로가기</button>
      </section>

      <!-- Card 3: Three.js Dorfromantik style Zen Game -->
      <section class="card" id="card-3">
        <div id="three-container-3"></div>
        <div class="c4-preview-label">under construction...</div>

        <div class="c3-track-dock c3-controls"></div>
        <button class="close-btn">뒤로가기</button>
      </section>
    </div>

    <nav class="indicator" id="indicator"></nav>

    <!-- 음소거 버튼 -->
    <button class="mute-btn" id="mute-btn">
      <span id="mute-icon">🔇</span>
    </button>

    <!-- Card 모듈 (script.js보다 먼저 로드) -->
    <script src="card4.js"></script>
    <script src="card6.js"></script>
    <script src="card3.js"></script>
    <!-- 메인 컨트롤러 (마지막에 로드) -->
    <script src="script.js"></script>
  </body>
</html>
